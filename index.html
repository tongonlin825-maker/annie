<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>粵語闖關樂園 · 澳門生活粵語</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --brown: #8B5E3C;
    --ink: #2B2B2B;
    --jyut: #1D3557;
    --green: #2A9D8F;
    --red: #E63946;
    --gold: #FFD166;
    --accent: #4A90D9;
    --accent-light: #EEF5FF;
  }

  html, body { height: 100%; }

  body {
    font-family: "KaiTi", "DFKai-SB", "BiauKai", "楷体", "Noto Serif HK", serif;
    background: linear-gradient(160deg, #FFF8E7 0%, #FFE9CF 45%, #FFD9B3 100%);
    min-height: 100vh;
    color: var(--ink);
    overflow-x: hidden;
    position: relative;
  }

  .bg-deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-deco span {
    position: absolute; font-size: 52px; opacity: 0.12;
    animation: floatY 14s ease-in-out infinite; user-select: none;
  }
  @keyframes floatY {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-24px) rotate(6deg); }
  }

  .screen {
    display: none; position: relative; z-index: 1;
    min-height: 100vh; padding: 28px 20px 50px;
    max-width: 1280px; margin: 0 auto;
  }
  .screen.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* ---------- 首頁 ---------- */
  .home-header { text-align: center; margin-bottom: 30px; }
  .home-header h1 {
    font-size: clamp(36px, 6vw, 64px);
    color: var(--brown); letter-spacing: 3px;
    text-shadow: 2px 2px 0 #fff, 5px 5px 0 rgba(139,94,60,0.12);
    margin-bottom: 12px;
  }
  .home-sub { font-size: clamp(18px, 2.4vw, 26px); color: var(--jyut); margin-bottom: 10px; font-weight: bold; }
  .home-tip {
    display: inline-block; background: rgba(255,255,255,0.75);
    border: 2px dashed var(--brown); border-radius: 999px;
    padding: 8px 22px; font-size: clamp(14px, 1.9vw, 19px); color: var(--brown);
  }

  .home-actions { display: flex; justify-content: center; gap: 14px; margin-bottom: 26px; flex-wrap: wrap; }

  .level-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 24px; margin-bottom: 30px;
  }

  .level-card {
    background: #fff; border-radius: 24px; padding: 26px 22px 22px;
    text-align: center; cursor: pointer; border: 3px solid transparent;
    box-shadow: 0 8px 24px rgba(139,94,60,0.12);
    transition: all 0.25s ease; position: relative; overflow: hidden;
  }
  .level-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 9px; background: var(--card-accent, #4A90D9);
  }
  .level-card:hover {
    transform: translateY(-7px) scale(1.02);
    box-shadow: 0 18px 40px rgba(139,94,60,0.22);
    border-color: var(--card-accent, #4A90D9);
  }
  .level-card .lv-emoji { font-size: 56px; display: block; margin: 8px 0 10px; }
  .level-card .lv-name { font-size: clamp(22px, 2.4vw, 30px); font-weight: bold; color: var(--brown); margin-bottom: 6px; }
  .level-card .lv-sub { font-size: clamp(14px, 1.6vw, 17px); color: #8a7a6a; margin-bottom: 14px; }
  .level-card .lv-stars { font-size: 26px; letter-spacing: 4px; min-height: 32px; }
  .level-card .lv-stars .dim { opacity: 0.2; }
  .level-card .lv-badge {
    position: absolute; top: 14px; right: 14px;
    font-size: 14px; padding: 4px 12px; border-radius: 999px;
    background: var(--card-accent, #4A90D9); color: #fff; opacity: 0.92;
  }
  .level-card .lv-best { font-size: 14px; color: var(--green); margin-top: 6px; min-height: 20px; }

  .home-footer {
    text-align: center; font-size: clamp(15px, 1.9vw, 20px);
    color: var(--brown); padding: 20px;
    border-top: 2px dashed rgba(139,94,60,0.25);
  }

  /* ---------- 遊戲頁 ---------- */
  .game-header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 8px; flex-wrap: wrap;
  }
  .icon-btn {
    background: #fff; border: 2.5px solid var(--brown); color: var(--brown);
    width: 54px; height: 54px; border-radius: 16px; font-size: 26px;
    cursor: pointer; font-family: inherit; transition: all 0.2s; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--brown); color: #fff; transform: scale(1.06); }

  .game-title-wrap { flex: 1; min-width: 180px; }
  .game-title-wrap h2 { font-size: clamp(24px, 3.2vw, 40px); color: var(--brown); line-height: 1.2; }
  .game-title-wrap p { font-size: clamp(14px, 1.7vw, 18px); color: #8a7a6a; margin-top: 3px; }

  .timer-box {
    background: #fff; border: 2.5px solid var(--brown); border-radius: 14px;
    padding: 6px 16px; font-size: clamp(18px, 2.2vw, 26px);
    font-weight: bold; color: var(--brown);
    font-family: "Courier New", monospace; flex-shrink: 0;
    min-width: 96px; text-align: center;
  }

  .progress-wrap { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .progress-bar {
    width: clamp(100px, 16vw, 220px); height: 16px;
    background: rgba(255,255,255,0.85); border: 2.5px solid var(--brown);
    border-radius: 999px; overflow: hidden;
  }
  #progressFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 999px; transition: width 0.4s ease;
  }
  #progressText { font-size: 17px; color: var(--brown); font-weight: bold; min-width: 56px; text-align: right; }

  .instruction {
    text-align: center; font-size: clamp(16px, 2vw, 21px);
    color: var(--jyut); background: rgba(255,255,255,0.7);
    border-radius: 14px; padding: 12px 18px; margin: 16px 0 22px;
    border-left: 6px solid var(--accent); font-weight: bold;
  }

  /* ---------- 配對棋盤 ---------- */
  .board { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .column { display: flex; flex-direction: column; gap: 14px; }

  .card {
    background: #fff; border: 3px solid #EAD9C7; border-radius: 18px;
    padding: 18px 20px; font-family: inherit;
    font-size: clamp(17px, 2.1vw, 25px); line-height: 1.4;
    color: var(--ink); cursor: pointer; text-align: left; width: 100%;
    min-height: 80px; display: flex; align-items: center;
    box-shadow: 0 5px 14px rgba(139,94,60,0.08);
    transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s, background 0.18s;
    word-break: break-word;
  }
  .card:hover:not(.matched) {
    transform: translateY(-3px); border-color: var(--accent);
    box-shadow: 0 10px 24px rgba(139,94,60,0.16);
  }
  .card.selected {
    border-color: var(--accent); background: var(--accent-light);
    box-shadow: 0 0 0 5px rgba(74,144,217,0.22);
  }
  .card.matched {
    border-color: var(--green); background: #E9F9F5; color: #1B7A6E;
    cursor: default; box-shadow: 0 5px 14px rgba(42,157,143,0.15);
  }
  .card.matched .card-text::after { content: ' ✓'; color: var(--green); font-weight: bold; }
  .card.wrong {
    border-color: var(--red) !important; background: #FFEBEE !important;
    animation: shake 0.5s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(9px); }
    60% { transform: translateX(-7px); }
    80% { transform: translateX(7px); }
  }
  .card-jyut .card-text {
    font-family: "Courier New", "Noto Sans Mono", monospace;
    color: var(--jyut); font-size: 0.92em; letter-spacing: 0.3px;
  }
  .card-small { font-size: clamp(15px, 1.8vw, 21px); }

  /* ---------- 對話重組 ---------- */
  .order-wrap { display: flex; flex-direction: column; gap: 18px; }
  .order-section-title {
    font-size: clamp(17px, 2vw, 22px); color: var(--brown);
    font-weight: bold; margin-bottom: 2px;
  }
  .order-target {
    background: rgba(255,255,255,0.7); border: 3px dashed var(--accent);
    border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    min-height: 90px;
  }
  .order-target .empty-hint {
    text-align: center; color: #a99; font-size: clamp(15px, 1.8vw, 19px);
    padding: 18px 8px;
  }
  .order-pool { display: flex; flex-direction: column; gap: 12px; }

  .order-line {
    background: #fff; border: 3px solid #EAD9C7; border-radius: 16px;
    padding: 14px 18px; display: flex; gap: 12px; align-items: flex-start;
    cursor: pointer; transition: all 0.18s; box-shadow: 0 4px 12px rgba(139,94,60,0.07);
  }
  .order-line:hover:not(.done) { transform: translateY(-2px); border-color: var(--accent); }
  .order-line .role-tag {
    flex-shrink: 0; font-size: clamp(13px, 1.5vw, 16px); font-weight: bold;
    color: #fff; background: var(--accent); border-radius: 10px;
    padding: 5px 12px; white-space: nowrap;
  }
  .order-line .line-body { flex: 1; }
  .order-line .line-text { font-size: clamp(16px, 2vw, 23px); line-height: 1.4; }
  .order-line .line-jyut {
    font-family: "Courier New", monospace; color: var(--jyut);
    font-size: clamp(13px, 1.6vw, 17px); margin-top: 3px;
  }
  .order-line.done {
    background: #E9F9F5; border-color: var(--green); cursor: default;
    box-shadow: none;
  }
  .order-line.done .role-tag { background: var(--green); }
  .order-line.wrong { border-color: var(--red) !important; background: #FFEBEE !important; animation: shake 0.5s ease; }

  .order-num {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
    background: var(--green); color: #fff; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; margin-top: 4px;
  }

  /* ---------- 聽力題 ---------- */
  .listen-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 24px;
    padding: 10px 0;
  }
  .speaker-btn {
    width: clamp(130px, 18vw, 180px); height: clamp(130px, 18vw, 180px);
    border-radius: 50%; border: 6px solid var(--accent);
    background: #fff; font-size: clamp(56px, 8vw, 80px);
    cursor: pointer; transition: all 0.2s; box-shadow: 0 10px 30px rgba(74,144,217,0.3);
    display: flex; align-items: center; justify-content: center;
  }
  .speaker-btn:hover { transform: scale(1.06); }
  .speaker-btn.playing { animation: pulse 0.8s ease infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(74,144,217,0.5); }
    50% { box-shadow: 0 0 0 20px rgba(74,144,217,0); }
  }
  .listen-hint { font-size: clamp(15px, 1.8vw, 19px); color: #8a7a6a; text-align: center; }

  .options {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    width: 100%; max-width: 820px;
  }
  .option-btn {
    background: #fff; border: 3px solid #EAD9C7; border-radius: 18px;
    padding: 20px 18px; font-family: "Courier New", monospace;
    font-size: clamp(18px, 2.2vw, 26px); color: var(--jyut);
    cursor: pointer; transition: all 0.18s; font-weight: bold;
    box-shadow: 0 5px 14px rgba(139,94,60,0.08); word-break: break-word;
  }
  .option-btn:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--accent); }
  .option-btn.correct { border-color: var(--green); background: #E9F9F5; color: #1B7A6E; }
  .option-btn.wrong { border-color: var(--red); background: #FFEBEE; animation: shake 0.5s ease; }
  .option-btn:disabled { cursor: default; opacity: 0.9; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; top: 24px; transform: translate(-50%, -150%);
    width: min(94vw, 700px); background: #fff; border-radius: 20px;
    padding: 18px 22px; display: flex; gap: 16px; align-items: flex-start;
    box-shadow: 0 14px 44px rgba(0,0,0,0.24); z-index: 400;
    transition: transform 0.35s cubic-bezier(.2,1.2,.4,1);
    border: 3.5px solid var(--green);
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast.err { border-color: var(--red); }
  .toast-icon {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: #fff; font-weight: bold;
    background: var(--green); flex-shrink: 0;
  }
  .toast.err .toast-icon { background: var(--red); }
  .toast-text { font-size: clamp(16px, 1.9vw, 20px); line-height: 1.55; color: var(--ink); padding-top: 5px; }
  .toast-text strong { color: var(--jyut); }

  /* ---------- 勝利結算 ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(40, 25, 15, 0.58);
    display: none; align-items: center; justify-content: center;
    z-index: 500; padding: 20px; backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; animation: fadeIn 0.3s ease; }

  .win-card {
    background: linear-gradient(160deg, #FFFDF7 0%, #FFF3E0 100%);
    border-radius: 30px; padding: 36px 30px 30px;
    width: min(94vw, 500px); text-align: center; position: relative;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    border: 4px solid var(--gold);
    animation: popIn 0.5s cubic-bezier(.2,1.4,.4,1);
    overflow: hidden; max-height: 92vh; overflow-y: auto;
  }
  @keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .win-emoji { font-size: 68px; margin-bottom: 6px; animation: bounce 1s ease infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .win-card h2 { font-size: 30px; color: var(--brown); margin-bottom: 10px; letter-spacing: 1px; }
  .win-stars { font-size: 46px; letter-spacing: 9px; margin: 10px 0 8px; min-height: 56px; }
  .win-stars span { display: inline-block; opacity: 0; transform: scale(0.3); }
  .win-stars span.on { animation: starPop 0.5s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes starPop { to { opacity: 1; transform: scale(1); } }
  .win-stars .dim { opacity: 0.18 !important; transform: scale(1); }
  .win-msg { font-size: 17px; color: #7a6a5a; margin: 8px 0 6px; line-height: 1.6; }
  .win-detail {
    font-size: 16px; color: var(--jyut); background: rgba(255,255,255,0.75);
    border-radius: 14px; padding: 12px 16px; margin: 14px 0 16px; line-height: 1.7;
  }
  .win-detail strong { color: var(--brown); }
  .name-row { display: flex; gap: 10px; margin: 12px 0 16px; }
  .name-input {
    flex: 1; font-family: inherit; font-size: 17px; padding: 12px 16px;
    border-radius: 14px; border: 2.5px solid var(--brown); outline: none;
    background: #fff; color: var(--ink);
  }
  .name-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(74,144,217,0.18); }
  .btn {
    font-family: inherit; font-size: 17px; padding: 13px 26px;
    border-radius: 14px; border: none; cursor: pointer;
    transition: all 0.2s; font-weight: bold;
  }
  .btn-primary {
    background: linear-gradient(135deg, #F4A261, #E76F51); color: #fff;
    box-shadow: 0 6px 18px rgba(231,111,81,0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(231,111,81,0.45); }
  .btn-ghost { background: #fff; color: var(--brown); border: 2.5px solid var(--brown); }
  .btn-ghost:hover { background: var(--brown); color: #fff; }
  .btn-gold { background: linear-gradient(135deg, #FFD166, #F4A261); color: #5C3A21; box-shadow: 0 6px 18px rgba(244,162,97,0.4); }
  .btn-gold:hover { transform: translateY(-2px); }
  .win-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .confetti-wrap { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti {
    position: absolute; top: -20px; width: 10px; height: 16px;
    border-radius: 2px; animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    to { transform: translateY(620px) rotate(720deg); opacity: 0; }
  }

  /* ---------- 排行榜 ---------- */
  .rank-header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
  .rank-header h1 { font-size: clamp(28px, 4vw, 44px); color: var(--brown); }
  .rank-block {
    background: #fff; border-radius: 22px; padding: 22px 24px;
    margin-bottom: 22px; box-shadow: 0 8px 24px rgba(139,94,60,0.1);
    border-left: 8px solid var(--rank-accent, #4A90D9);
  }
  .rank-block h3 { font-size: clamp(20px, 2.4vw, 28px); color: var(--brown); margin-bottom: 14px; }
  .rank-table { width: 100%; border-collapse: collapse; }
  .rank-table th, .rank-table td {
    padding: 12px 10px; text-align: left; font-size: clamp(15px, 1.8vw, 19px);
    border-bottom: 1px solid #eee;
  }
  .rank-table th { color: #8a7a6a; font-weight: bold; font-size: clamp(13px, 1.5vw, 16px); }
  .rank-table tr:last-child td { border-bottom: none; }
  .rank-table .medal { font-size: 22px; }
  .rank-empty { color: #a99; font-size: 16px; padding: 12px 0; }

  /* ---------- 手機 ---------- */
  @media (max-width: 680px) {
    .screen { padding: 18px 12px 34px; }
    .board { gap: 10px; }
    .card { padding: 12px 13px; min-height: 66px; border-radius: 15px; border-width: 2.5px; }
    .toast { top: 12px; padding: 13px 15px; gap: 10px; }
    .toast-icon { width: 34px; height: 34px; font-size: 20px; }
    .win-card { padding: 26px 18px 22px; }
    .win-card h2 { font-size: 24px; }
    .win-stars { font-size: 36px; }
    .btn { font-size: 15px; padding: 11px 20px; }
    .options { grid-template-columns: 1fr; }
    .timer-box { font-size: 18px; min-width: 82px; padding: 5px 12px; }
    .game-title-wrap h2 { font-size: 22px; }
    .order-line { padding: 11px 13px; }
  }
</style>
</head>
<body>

<div class="bg-deco" id="bgDeco"></div>

<!-- ==================== 首頁 ==================== -->
<section id="home" class="screen active">
  <header class="home-header">
    <h1>🎡 粵語闖關樂園</h1>
    <p class="home-sub">澳門生活粵語 · 七關挑戰</p>
    <p class="home-tip">配對正確得星星 · 計時挑戰 · 錯題可重練</p>
  </header>

  <div class="home-actions">
    <button class="btn btn-ghost" onclick="showRank()">🏆 排行榜</button>
    <button class="btn btn-ghost" onclick="resetAll()">🗑️ 清除紀錄</button>
  </div>

  <div class="level-grid" id="levelGrid"></div>

  <footer class="home-footer">
    唔使驚講錯，最緊要肯開口！<br>
    <span style="font-family:'Courier New',monospace;font-size:15px;color:#1D3557;">
      m4 sai2 geng1 gong2 co3, zeoi3 gan2 jiu3 hang2 hoi1 hau2!
    </span>
  </footer>
</section>

<!-- ==================== 遊戲頁 ==================== -->
<section id="game" class="screen">
  <header class="game-header">
    <button class="icon-btn" id="backBtn" title="返回地圖">←</button>
    <div class="game-title-wrap">
      <h2 id="gameTitle"></h2>
      <p id="gameSub"></p>
    </div>
    <div class="timer-box" id="timer">00:00</div>
    <div class="progress-wrap">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <span id="progressText">0 / 0</span>
    </div>
  </header>

  <p class="instruction" id="instruction"></p>

  <div id="board" class="board"></div>
</section>

<!-- ==================== 排行榜 ==================== -->
<section id="rank" class="screen">
  <header class="rank-header">
    <button class="icon-btn" onclick="backHome()">←</button>
    <h1>🏆 排行榜</h1>
  </header>
  <div id="rankContent"></div>
</section>

<!-- ==================== Toast ==================== -->
<div class="toast" id="toast">
  <div class="toast-icon">✓</div>
  <div class="toast-text"></div>
</div>

<!-- ==================== 勝利結算 ==================== -->
<div class="modal-overlay" id="winModal">
  <div class="win-card">
    <div class="confetti-wrap" id="confettiWrap"></div>
    <div class="win-emoji" id="winEmoji">🎉</div>
    <h2 id="winTitle">恭喜闖關成功！</h2>
    <div class="win-stars" id="winStars"></div>
    <p class="win-msg" id="winMsg"></p>
    <div class="win-detail" id="winDetail"></div>
    <div class="name-row" id="nameRow">
      <input class="name-input" id="nameInput" maxlength="12" placeholder="輸入你嘅名字" />
      <button class="btn btn-gold" id="saveScoreBtn">保存成績</button>
    </div>
    <div class="win-buttons">
      <button class="btn btn-primary" id="nextBtn">下一關 →</button>
      <button class="btn btn-ghost" id="retryBtn">重練錯題</button>
      <button class="btn btn-ghost" id="homeBtn">返回地圖</button>
    </div>

/* =========================================================
   工具
   ========================================================= */
function $(id) { return document.getElementById(id); }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const ss = s % 60;
  return String(m).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
}

/* =========================================================
   音效
   ========================================================= */
let audioCtx = null;
function playSound(ok) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const notes = ok ? [523.25, 783.99] : [220, 164.81];
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = ok ? "sine" : "triangle";
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now + i * 0.1);
      g.gain.exponentialRampToValueAtTime(0.18, now + i * 0.1 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.1 + 0.24);
      o.connect(g).connect(audioCtx.destination);
      o.start(now + i * 0.1);
      o.stop(now + i * 0.1 + 0.28);
    });
  } catch (e) {}
}

/* =========================================================
   語音合成（粵語）
   ========================================================= */
let voicesReady = false;
function initVoices() {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => { voicesReady = true; };
}

function pickCantoneseVoice() {
  if (!("speechSynthesis" in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => /yue|zh-HK|zh_HK|Cantonese|Hong Kong/i.test(v.lang + " " + v.name)) || null;
}

function speakCantonese(text, btn) {
  if (!("speechSynthesis" in window)) {
    showToast(false, "你嘅瀏覽器唔支援語音合成，請用 Chrome 或 Edge。");
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-HK";
  u.rate = 0.82;
  u.pitch = 1;
  const yue = pickCantoneseVoice();
  if (yue) u.voice = yue;

  if (btn) {
    btn.classList.add("playing");
    u.onend = () => btn.classList.remove("playing");
    u.onerror = () => btn.classList.remove("playing");
  }
  window.speechSynthesis.speak(u);
}

/* =========================================================
   排行榜存取
   ========================================================= */
function getRank() {
  try {
    return JSON.parse(localStorage.getItem("yq_rank_v2") || "{}");
  } catch (e) { return {}; }
}
function saveRank(obj) {
  localStorage.setItem("yq_rank_v2", JSON.stringify(obj));
}
function getBestStars(levelIndex) {
  const r = getRank();
  const arr = r[levelIndex] || [];
  if (!arr.length) return 0;
  return Math.max(...arr.map(x => x.stars));
}
function getBestTime(levelIndex) {
  const r = getRank();
  const arr = r[levelIndex] || [];
  if (!arr.length) return null;
  const best = arr.slice().sort((a, b) => a.time - b.time)[0];
  return best.time;
}
function addScore(levelIndex, rec) {
  const r = getRank();
  if (!r[levelIndex]) r[levelIndex] = [];
  r[levelIndex].push(rec);
  r[levelIndex].sort((a, b) => {
    if (b.stars !== a.stars) return b.stars - a.stars;
    return a.time - b.time;
  });
  r[levelIndex] = r[levelIndex].slice(0, 10);
  saveRank(r);
}
function resetAll() {
  if (!confirm("確定清除所有成績同排行榜紀錄？")) return;
  localStorage.removeItem("yq_rank_v2");
  renderHome();
}

/* =========================================================
   首頁
   ========================================================= */
function renderHome() {
  const grid = $("levelGrid");
  grid.innerHTML = "";
  LEVELS.forEach((lv, i) => {
    const stars = getBestStars(i);
    const bestTime = getBestTime(i);
    const card = document.createElement("div");
    card.className = "level-card";
    card.style.setProperty("--card-accent", lv.accent);
    card.innerHTML = `
      <span class="lv-badge">第 ${i + 1} 關</span>
      <span class="lv-emoji">${lv.emoji}</span>
      <div class="lv-name">${lv.name}</div>
      <div class="lv-sub">${lv.subtitle}</div>
      <div class="lv-stars">
        ${[1,2,3].map(n => `<span class="${n <= stars ? '' : 'dim'}">⭐</span>`).join("")}
      </div>
      <div class="lv-best">${bestTime !== null ? "⏱ 最佳 " + fmtTime(bestTime) : ""}</div>
    `;
    card.addEventListener("click", () => startLevel(i, "normal"));
    grid.appendChild(card);
  });
}

/* =========================================================
   開始關卡
   ========================================================= */
function startLevel(index, mode, retryIds) {
  state.levelIndex = index;
  state.mode = mode || "normal";
  state.selectedLeft = null;
  state.selectedRight = null;
  state.matched = 0;
  state.wrong = 0;
  state.locked = false;
  state.wrongIds = new Set();
  state.orderIndex = 0;
  state.qIndex = 0;

  const lv = LEVELS[index];

  // 建立本局資料
  if (lv.type === "match") {
    if (mode === "retry" && retryIds && retryIds.length) {
      state.currentPairs = retryIds.map(id => lv.pairs[id]);
    } else {
      state.currentPairs = lv.pairs.slice();
    }
  } else if (lv.type === "order") {
    state.currentSequence = lv.sequence.slice();
  } else if (lv.type === "listen") {
    state.currentQuestions = lv.questions.slice();
  }

  // 主題色
  document.documentElement.style.setProperty("--accent", lv.accent);
  document.documentElement.style.setProperty("--accent-light", lv.accentLight);

  $("gameTitle").textContent = lv.emoji + " " + lv.name + (state.mode === "retry" ? " · 錯題重練" : "");
  $("gameSub").textContent = lv.subtitle;
  $("instruction").textContent = "👉 " + lv.instruction;

  updateProgress();

  // 渲染棋盤
  const board = $("board");
  board.innerHTML = "";

  if (lv.type === "match") renderMatch(board);
  else if (lv.type === "order") renderOrder(board);
  else if (lv.type === "listen") renderListen(board);

  // 切換畫面
  $("home").classList.remove("active");
  $("rank").classList.remove("active");
  $("game").classList.add("active");
  window.scrollTo(0, 0);

  // 計時
  startTimer();
}

/* =========================================================
   計時器
   ========================================================= */
function startTimer() {
  stopTimer();
  state.startTime = Date.now();
  state.elapsed = 0;
  $("timer").textContent = "00:00";
  state.timerId = setInterval(() => {
    state.elapsed = Math.floor((Date.now() - state.startTime) / 1000);
    $("timer").textContent = fmtTime(state.elapsed);
  }, 250);
}
function stopTimer() {
  if (state.timerId) clearInterval(state.timerId);
  state.timerId = null;
  if (state.startTime) {
    state.elapsed = Math.floor((Date.now() - state.startTime) / 1000);
  }
}

/* =========================================================
   渲染：配對
   ========================================================= */
function renderMatch(board) {
  board.className = "board";
  const leftCol = document.createElement("div");
  leftCol.className = "column";
  leftCol.id = "colLeft";
  const rightCol = document.createElement("div");
  rightCol.className = "column";
  rightCol.id = "colRight";
  board.appendChild(leftCol);
  board.appendChild(rightCol);

  const pairs = state.currentPairs;
  const lefts = shuffle(pairs.map((p, i) => ({ text: p.left, id: i, small: p.small })));
  const rights = shuffle(pairs.map((p, i) => ({ text: p.right, id: i, small: p.small })));

  lefts.forEach(item => leftCol.appendChild(makeCard(item, "left")));
  rights.forEach(item => rightCol.appendChild(makeCard(item, "right")));

  board.onclick = (e) => {
    const card = e.target.closest(".card");
    if (!card) return;
    if (state.locked) return;
    if (card.classList.contains("matched")) return;
    onMatchCardClick(card);
  };
}

function makeCard(item, side) {
  const btn = document.createElement("button");
  btn.className = "card" + (side === "right" ? " card-jyut" : "") + (item.small ? " card-small" : "");
  btn.dataset.side = side;
  btn.dataset.id = item.id;
  btn.innerHTML = `<span class="card-text">${item.text}</span>`;
  return btn;
}

function onMatchCardClick(card) {
  const side = card.dataset.side;

  if (side === "left") {
    if (state.selectedLeft === card) {
      card.classList.remove("selected");
      state.selectedLeft = null;
      return;
    }
    if (state.selectedLeft) state.selectedLeft.classList.remove("selected");
    state.selectedLeft = card;
    card.classList.add("selected");
  } else {
    if (state.selectedRight === card) {
      card.classList.remove("selected");
      state.selectedRight = null;
      return;
    }
    if (state.selectedRight) state.selectedRight.classList.remove("selected");
    state.selectedRight = card;
    card.classList.add("selected");
  }

  if (state.selectedLeft && state.selectedRight) checkMatch();
}

function checkMatch() {
  const l = state.selectedLeft;
  const r = state.selectedRight;
  const pairs = state.currentPairs;
  const idL = +l.dataset.id;
  const idR = +r.dataset.id;
  const pair = pairs[idL];

  if (idL === idR) {
    l.classList.remove("selected");
    r.classList.remove("selected");
    l.classList.add("matched");
    r.classList.add("matched");
    state.selectedLeft = null;
    state.selectedRight = null;
    state.matched++;
    updateProgress();
    playSound(true);
    showToast(true, "啱喇！" + pair.tip);

    if (state.matched === pairs.length) {
      state.locked = true;
      setTimeout(showWin, 750);
    }
  } else {
    state.wrong++;
    state.wrongIds.add(idL);
    state.locked = true;

    l.classList.add("wrong");
    r.classList.add("wrong");
    playSound(false);

    showToast(false, `唔啱喎。「${pair.left}」應該配「${pair.right}」。${pair.tip}`);

    setTimeout(() => {
      l.classList.remove("wrong", "selected");
      r.classList.remove("wrong", "selected");
      state.selectedLeft = null;
      state.selectedRight = null;
      state.locked = false;
    }, 1000);
  }
}

/* =========================================================
   渲染：對話重組
   ========================================================= */
function renderOrder(board) {
  board.className = "order-wrap";
  board.innerHTML = `
    <div class="order-section-title">✅ 已完成對話</div>
    <div class="order-target" id="orderTarget">
      <div class="empty-hint">由下面揀第一句開始，按正確順序排好。</div>
    </div>
    <div class="order-section-title" style="margin-top:6px;">👇 點擊句子，按順序排好</div>
    <div class="order-pool" id="orderPool"></div>
  `;

  const pool = $("orderPool");
  const seq = state.currentSequence;
  const shuffled = shuffle(seq.map((s, i) => ({ ...s, id: i })));

  shuffled.forEach(item => {
    const div = document.createElement("div");
    div.className = "order-line";
    div.dataset.id = item.id;
    div.innerHTML = `
      <span class="role-tag">${item.role}</span>
      <div class="line-body">
        <div class="line-text">${item.text}</div>
        <div class="line-jyut">${item.jyut}</div>
      </div>
    `;
    div.addEventListener("click", () => onOrderClick(div));
    pool.appendChild(div);
  });
}

function onOrderClick(el) {
  if (state.locked) return;
  if (el.classList.contains("done")) return;

  const id = +el.dataset.id;
  const seq = state.currentSequence;

  if (id === state.orderIndex) {
    // 正確
    el.classList.add("done");
    el.style.cursor = "default";
    const target = $("orderTarget");
    const hint = target.querySelector(".empty-hint");
    if (hint) hint.remove();

    const item = seq[id];
    const row = document.createElement("div");
    row.className = "order-line done";
    row.innerHTML = `
      <span class="order-num">${state.orderIndex + 1}</span>
      <span class="role-tag">${item.role}</span>
      <div class="line-body">
        <div class="line-text">${item.text}</div>
        <div class="line-jyut">${item.jyut}</div>
      </div>
    `;
    target.appendChild(row);

    // 從 pool 移除
    el.remove();

    state.orderIndex++;
    updateProgress();
    playSound(true);
    showToast(true, `第 ${state.orderIndex} 句啱喇！${item.tip}`);

    if (state.orderIndex === seq.length) {
      state.locked = true;
      setTimeout(showWin, 750);
    }
  } else {
    // 錯誤
    state.wrong++;
    state.wrongIds.add(state.orderIndex);
    state.locked = true;
    el.classList.add("wrong");
    playSound(false);
    const correct = seq[state.orderIndex];
    showToast(false, `次序唔啱喎。下一個應該係「${correct.role}：${correct.text}」。`);

    setTimeout(() => {
      el.classList.remove("wrong");
      state.locked = false;
    }, 1000);
  }
}

/* =========================================================
   渲染：聽力題
   ========================================================= */
function renderListen(board) {
  board.className = "listen-wrap";
  renderListenQuestion();
  board.onclick = (e) => {
    const btn = e.target.closest(".option-btn");
    if (!btn) return;
    onListenAnswer(btn);
  };
}

function renderListenQuestion() {
  const board = $("board");
  const q = state.currentQuestions[state.qIndex];
  if (!q) return;

  // 打亂選項
  const opts = shuffle(q.options.slice());

  board.innerHTML = `
    <button class="speaker-btn" id="speakerBtn" title="播放粵語">🔊</button>
    <div class="listen-hint">點喇叭聽粵語，再選出正確嘅粵拼<br><span style="font-size:0.85em;color:#b0a090;">（可重複點擊播放）</span></div>
    <div class="options" id="listenOptions"></div>
  `;

  const speaker = $("speakerBtn");
  speaker.addEventListener("click", () => speakCantonese(q.text, speaker));

  const optWrap = $("listenOptions");
  opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "option-btn";
    b.textContent = o;
    b.dataset.value = o;
    optWrap.appendChild(b);
  });

  // 自動播放一次（若瀏覽器允許）
  setTimeout(() => {
    try { speakCantonese(q.text, speaker); } catch (e) {}
  }, 350);

  updateProgress();
}

function onListenAnswer(btn) {
  if (state.locked) return;
  const q = state.currentQuestions[state.qIndex];
  const val = btn.dataset.value;

  if (val === q.answer) {
    btn.classList.add("correct");
    state.locked = true;
    playSound(true);
    showToast(true, `啱喇！「${q.text}」讀 ${q.answer}。${q.tip}`);

    setTimeout(() => {
      state.qIndex++;
      state.locked = false;
      if (state.qIndex >= state.currentQuestions.length) {
        showWin();
      } else {
        renderListenQuestion();
      }
    }, 1300);
  } else {
    btn.classList.add("wrong");
    btn.disabled = true;
    state.wrong++;
    state.wrongIds.add(state.qIndex);
    playSound(false);
    showToast(false, `唔啱喎。正確答案係 ${q.answer}。${q.tip}`);
  }
}

/* =========================================================
   進度
   ========================================================= */
function updateProgress() {
  const lv = LEVELS[state.levelIndex];
  let done = 0, total = 0;

  if (lv.type === "match") {
    done = state.matched;
    total = state.currentPairs.length;
  } else if (lv.type === "order") {
    done = state.orderIndex;
    total = state.currentSequence.length;
  } else if (lv.type === "listen") {
    done = state.qIndex;
    total = state.currentQuestions.length;
  }

  $("progressText").textContent = done + " / " + total;
  $("progressFill").style.width = total ? (done / total * 100) + "%" : "0%";
}

/* =========================================================
   Toast
   ========================================================= */
let toastTimer = null;
function showToast(ok, text) {
  const toast = $("toast");
  toast.className = "toast " + (ok ? "ok" : "err") + " show";
  toast.querySelector(".toast-icon").textContent = ok ? "✓" : "✗";
  toast.querySelector(".toast-text").innerHTML = text;

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, ok ? 3000 : 4000);
}

/* =========================================================
   勝利結算
   ========================================================= */
function showWin() {
  stopTimer();
  const lv = LEVELS[state.levelIndex];
  const wrong = state.wrong;
  const time = state.elapsed;

  const stars = wrong <= 1 ? 3 : wrong <= 3 ? 2 : 1;
  const isRetry = state.mode === "retry";

  $("winEmoji").textContent = stars === 3 ? "🏆" : stars === 2 ? "🎉" : "👍";
  $("winTitle").textContent = stars === 3 ? "完美通關！" : stars === 2 ? "恭喜闖關成功！" : "過關喇！";

  const starEls = [1, 2, 3].map(n =>
    `<span class="${n <= stars ? 'on' : 'dim'}" style="animation-delay:${n * 0.18}s">⭐</span>`
  ).join("");
  $("winStars").innerHTML = starEls;

  $("winMsg").textContent =
    stars === 3 ? "你全部一次過配對正確，好叻呀！" :
    stars === 2 ? "表現唔錯，再練習一次可以攞三粒星！" :
    "完成咗喇！記住錯過嘅詞語，再挑戰一次。";

  $("winDetail").innerHTML =
    `關卡：<strong>${lv.emoji} ${lv.name}</strong>${isRetry ? "（錯題重練）" : ""}<br>` +
    `用時：<strong>${fmtTime(time)}</strong>　錯誤：<strong>${wrong}</strong> 次<br>` +
    `<span style="color:#8a7a6a;font-size:14px;">${lv.subtitle}</span>`;

  // 名字輸入
  const nameRow = $("nameRow");
  if (isRetry) {
    nameRow.style.display = "none";
  } else {
    nameRow.style.display = "flex";
    const last = localStorage.getItem("yq_player_name") || "";
    $("nameInput").value = last;
    $("saveScoreBtn").onclick = () => {
      const name = ($("nameInput").value || "匿名同學").trim().slice(0, 12);
      localStorage.setItem("yq_player_name", name);
      addScore(state.levelIndex, {
        name, time, stars, wrong,
        date: new Date().toLocaleDateString("zh-HK")
      });
      $("saveScoreBtn").textContent = "已保存 ✓";
      $("saveScoreBtn").disabled = true;
      $("saveScoreBtn").style.opacity = "0.7";
    };
    $("saveScoreBtn").textContent = "保存成績";
    $("saveScoreBtn").disabled = false;
    $("saveScoreBtn").style.opacity = "1";
  }

  // 下一關
  const nextBtn = $("nextBtn");
  if (state.levelIndex >= LEVELS.length - 1) {
    nextBtn.textContent = "返回地圖";
    nextBtn.onclick = () => { closeWin(); backHome(); };
  } else {
    nextBtn.textContent = "下一關 →";
    nextBtn.onclick = () => {
      closeWin();
      startLevel(state.levelIndex + 1, "normal");
    };
  }

  // 重練錯題
  const retryBtn = $("retryBtn");
  const hasWrong = state.wrongIds.size > 0;
  if (hasWrong && lv.type === "match" && !isRetry) {
    retryBtn.style.display = "inline-block";
    retryBtn.textContent = `重練錯題（${state.wrongIds.size}）`;
    retryBtn.onclick = () => {
      closeWin();
      startLevel(state.levelIndex, "retry", Array.from(state.wrongIds));
    };
  } else if (hasWrong && lv.type !== "match" && !isRetry) {
    retryBtn.style.display = "inline-block";
    retryBtn.textContent = "再練一次";
    retryBtn.onclick = () => {
      closeWin();
      startLevel(state.levelIndex, "retry");
    };
  } else {
    retryBtn.style.display = "none";
  }

  $("winModal").classList.add("show");
  confetti();
  playSound(true);
}

function closeWin() {
  $("winModal").classList.remove("show");
  $("confettiWrap").innerHTML = "";
}

function confetti() {
  const wrap = $("confettiWrap");
  wrap.innerHTML = "";
  const colors = ["#FFD166", "#EF476F", "#06D6A0", "#118AB2", "#FF9F1C", "#9B5DE5"];
  for (let i = 0; i < 50; i++) {
    const d = document.createElement("div");
    d.className = "confetti";
    d.style.left = (Math.random() * 100) + "%";
    d.style.background = colors[Math.floor(Math.random() * colors.length)];
    d.style.animationDelay = (Math.random() * 0.6) + "s";
    d.style.animationDuration = (1.4 + Math.random() * 1.2) + "s";
    d.style.width = (6 + Math.random() * 8) + "px";
    d.style.height = (10 + Math.random() * 10) + "px";
    wrap.appendChild(d);
  }
}

/* =========================================================
   排行榜頁
   ========================================================= */
function showRank() {
  $("home").classList.remove("active");
  $("game").classList.remove("active");
  $("rank").classList.add("active");
  renderRank();
  window.scrollTo(0, 0);
}

function renderRank() {
  const wrap = $("rankContent");
  const rank = getRank();
  wrap.innerHTML = "";

  let hasAny = false;
  LEVELS.forEach((lv, i) => {
    const arr = rank[i] || [];
    if (arr.length) hasAny = true;

    const block = document.createElement("div");
    block.className = "rank-block";
    block.style.setProperty("--rank-accent", lv.accent);

    let tableHTML = "";
    if (!arr.length) {
      tableHTML = `<div class="rank-empty">仲未有紀錄，快啲去挑戰！</div>`;
    } else {
      tableHTML = `
        <table class="rank-table">
          <thead>
            <tr><th>名次</th><th>名字</th><th>星星</th><th>用時</th><th>錯誤</th><th>日期</th></tr>
          </thead>
          <tbody>
            ${arr.slice(0, 5).map((r, idx) => {
              const medal = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : (idx + 1);
              return `<tr>
                <td class="medal">${medal}</td>
                <td>${escapeHtml(r.name)}</td>
                <td>${"⭐".repeat(r.stars)}</td>
                <td>${fmtTime(r.time)}</td>
                <td>${r.wrong}</td>
                <td>${r.date}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      `;
    }

    block.innerHTML = `<h3>${lv.emoji} 第 ${i + 1} 關 · ${lv.name}</h3>${tableHTML}`;
    wrap.appendChild(block);
  });

  if (!hasAny) {
    const tip = document.createElement("div");
    tip.className = "rank-block";
    tip.innerHTML = `<div class="rank-empty" style="text-align:center;font-size:18px;padding:20px;">🏁 仲未有排行榜紀錄。完成任何一關並保存成績，就會出現在呢度。</div>`;
    wrap.prepend(tip);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

/* =========================================================
   返回
   ========================================================= */
function backHome() {
  stopTimer();
  closeWin();
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  $("game").classList.remove("active");
  $("rank").classList.remove("active");
  $("home").classList.add("active");
  renderHome();
  window.scrollTo(0, 0);
}

/* =========================================================
   事件綁定
   ========================================================= */
$("backBtn").addEventListener("click", () => {
  if (confirm("確定返回地圖？今次進度唔會保存。")) backHome();
});
$("homeBtn").addEventListener("click", () => {
  closeWin();
  backHome();
});

/* 初始化 */
initVoices();
renderHome();
</script>
</body>
